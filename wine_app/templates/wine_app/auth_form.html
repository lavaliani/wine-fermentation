{% extends "wine_app/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="form-shell narrow">
  <div class="section-heading"><h1>{{ title }}</h1></div>
  <form method="post" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button full" type="submit">{{ title }}</button>
  </form>
</section>
{% endblock %}
